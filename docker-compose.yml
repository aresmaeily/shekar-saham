services:
  radar-bourse:
    build: .
    container_name: radar-bourse
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      PRIVATE_MODE: ${PRIVATE_MODE:-1}
      PRIVATE_PASSWORD: ${PRIVATE_PASSWORD:-change-me-strong-password}
      API_KEY: ${API_KEY:-change-me-api-key}
      FERNET_KEY: ${FERNET_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      POLL_SECONDS: ${POLL_SECONDS:-30}
    volumes:
      # داده و بکاپ‌ها روی دیسک میزبان بمانند
      - ./data:/app/data
