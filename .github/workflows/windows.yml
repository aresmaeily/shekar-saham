name: Windows validation

# GOV-32 Phase 4 — durable automated Windows validation.
#
# Executes the machine-checkable core of the canonical Windows runbook
# (docs/active package: WINDOWS_VALIDATION_OR_HANDOFF — checks W1, W2, W6,
# W7) on a real hosted Windows runner: backend install, application boot,
# /api/health version consistency, the 7-contract browser E2E suite against
# the locally booted server, and runtime-log capture (fail-closed posture).
#
# The Electron shell portion (W2 icon rendering, W3-W5 shell navigation)
# requires the interactive runbook on the Windows owner machine and is not
# automatable here; the workflow proves the application layer end-to-end.
#
# NOTE: this workflow runs when code reaches GitHub (push / pull_request).
# Until push authorization is recorded (blocker B8), it exists as the ready
# durable solution and has not yet executed on the remote.

# MASTER-WAVE-2 hardening (W2-SEC C-1/C-3): least-privilege workflow token and
# third-party actions pinned by immutable commit SHA (same authoritative SHAs
# as ci.yml; verified via git ls-remote on 2026-11-02).
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record provenance (commit / runner)
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --porcelain
          "runner OS: $(Get-ComputerInfo -Property OsName,OsVersion | Out-String)" | Out-File -Append windows_run_provenance.txt
          git rev-parse HEAD | Out-File -Append windows_run_provenance.txt

      # WS-6 (W2-INST F3 authorized follow-up): PowerShell syntax gate — the
      # four shipped .ps1 scripts are parsed with the real PowerShell language
      # parser on a real pwsh host. Until this step existed, NO automation
      # anywhere parsed the shipped scripts (W2-INST S2 honestly recorded
      # NOT-RUN-HERE: pwsh is absent from the dev sandbox). A parse error in
      # any shipped script now fails the job BEFORE any install step runs.
      - name: PowerShell script syntax gate (W2-INST F3)
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/windows/install.ps1',
            'scripts/windows/start.ps1',
            'scripts/windows/validate_install.ps1',
            'scripts/windows/validate_alpha.ps1'
          )
          $failures = @()
          foreach ($s in $scripts) {
            if (-not (Test-Path $s)) { $failures += "$s MISSING"; continue }
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $s), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $detail = ($errors | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }) -join '; '
              $failures += "$s PARSE_ERRORS: $detail"
            }
          }
          if ($failures.Count -gt 0) {
            Write-Host 'PS1 SYNTAX GATE FAILED:'
            $failures | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "PS1 SYNTAX GATE: all $($scripts.Count) shipped scripts parse clean"

      # MASTER-WAVE-2 (W2-SEC C-12): aligned to 3.13 — the same version the
      # ci.yml battery job and the Docker image (python:3.13-slim) already use,
      # removing the 3.12/3.13 runner drift recorded by the W2 audits.
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Boot backend (W1 startup)
        working-directory: backend
        shell: pwsh
        run: |
          $p = Start-Process -FilePath python -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000" -PassThru -RedirectStandardOutput ..\windows_uvicorn_stdout.log -RedirectStandardError ..\windows_uvicorn_stderr.log -NoNewWindow
          $p.Id | Out-File ..\windows_uvicorn_pid.txt
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/health" -UseBasicParsing -TimeoutSec 5
              if ($h.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { Get-Content ..\windows_uvicorn_stderr.log; exit 1 }

      - name: Health + version consistency (W2)
        shell: pwsh
        run: |
          # GOV-49 (revised after run 41335202370): the W1-started server does
          # not survive the W1->W2 step boundary on Windows runners (100 s of
          # bounded retries all failed — deterministic, not transient), so this
          # step is SELF-SUFFICIENT: re-verify the existing server first; if
          # unreachable, boot the same app the same way W1 does, then run the
          # unchanged W2 assertions. Every path prints diagnostics; every
          # original W2 assertion is preserved and fail-closed.
          $h = $null
          $lastErr = ""
          for ($i = 1; $i -le 5; $i++) {
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 5
              break
            } catch {
              $lastErr = $_.Exception.Message
              $h = $null
              Start-Sleep -Seconds 2
            }
          }
          if ($null -eq $h) {
            "W2: existing server unreachable ($lastErr) — booting the app in this step" | Out-File -Append windows_run_provenance.txt
            $outLog = Join-Path (Get-Location) "windows_uvicorn_w2_stdout.log"
            $errLog = Join-Path (Get-Location) "windows_uvicorn_w2_stderr.log"
            $pidFile = Join-Path (Get-Location) "windows_uvicorn_pid.txt"
            $p = Start-Process -FilePath python -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000" -WorkingDirectory "backend" -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog -NoNewWindow
            $p.Id | Out-File -FilePath $pidFile
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 5
                break
              } catch { $lastErr = $_.Exception.Message; $h = $null }
            }
          }
          if ($null -eq $h) {
            "W2 DIAGNOSTIC: health endpoint unreachable after bounded re-verify/boot; last error: $lastErr" | Out-File -Append windows_run_provenance.txt
            "=== W2 DIAGNOSTIC: W2-boot uvicorn stderr (last 60 lines) ==="
            Get-Content windows_uvicorn_w2_stderr.log -ErrorAction SilentlyContinue | Select-Object -Last 60
            "=== W2 DIAGNOSTIC: W1 uvicorn stderr (last 60 lines) ==="
            Get-Content windows_uvicorn_stderr.log -ErrorAction SilentlyContinue | Select-Object -Last 60
            Write-Error "health endpoint unreachable after bounded re-verify/boot: $lastErr"
            exit 1
          }
          $h | ConvertTo-Json -Depth 5 | Out-File windows_health.json
          $version = $h.version
          if (-not $version) { Write-Error "health response carries no version field"; exit 1 }
          # W2: version consistency — the displayed API version must equal the
          # committed application version (runbook acceptance criterion).
          $match = Get-Content backend/app/core/config.py | Select-String -Pattern 'version: str = "(.+)"'
          if (-not $match) { Write-Error "committed version pattern not found in backend/app/core/config.py"; exit 1 }
          $committed = $match.Matches.Groups[1].Value
          if ($version -ne $committed) { Write-Error "version mismatch: health=$version committed=$committed"; exit 1 }
          "health version: $version (== committed)" | Out-File -Append windows_run_provenance.txt

      - name: Browser E2E suite (W6 — 7/7 expected)
        shell: pwsh
        run: |
          # GOV-49: the server does not survive step boundaries on Windows
          # runners — ensure it is reachable (booting it if needed, exactly as
          # W1 does) before the E2E suite runs.
          $h = $null
          for ($i = 1; $i -le 5; $i++) {
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 5
              break
            } catch { $h = $null; Start-Sleep -Seconds 2 }
          }
          if ($null -eq $h) {
            $outLog = Join-Path (Get-Location) "windows_uvicorn_stdout.log"
            $errLog = Join-Path (Get-Location) "windows_uvicorn_stderr.log"
            $pidFile = Join-Path (Get-Location) "windows_uvicorn_pid.txt"
            $p = Start-Process -FilePath python -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000" -WorkingDirectory "backend" -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog -NoNewWindow
            $p.Id | Out-File -FilePath $pidFile
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                $h = Invoke-RestMethod -Uri "http://127.0.0.1:8000/api/health" -TimeoutSec 5
                break
              } catch { $h = $null }
            }
            if ($null -eq $h) { Write-Error "server unreachable in W6 after fresh boot"; exit 1 }
          }
          pip install playwright==1.57.0
          playwright install chromium
          $env:RADAR_E2E_BASE_URL = "http://127.0.0.1:8000"
          python -m pytest e2e -q --junitxml=windows_e2e_junit.xml 2>&1 | Tee-Object -FilePath windows_e2e_stdout.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Runtime log posture (W7 — fail-closed evidence)
        shell: pwsh
        run: |
          "=== uvicorn stdout ==="  | Out-File -Append windows_run_provenance.txt
          Get-Content windows_uvicorn_stdout.log -ErrorAction SilentlyContinue | Select-Object -First 80 | Out-File -Append windows_run_provenance.txt
          "=== uvicorn stderr ==="  | Out-File -Append windows_run_provenance.txt
          Get-Content windows_uvicorn_stderr.log -ErrorAction SilentlyContinue | Select-Object -First 80 | Out-File -Append windows_run_provenance.txt
          # Fail-closed posture assertions (runbook W7): without FERNET_KEY the
          # boot must WARN (ephemeral key) and must not crash; without provider
          # credentials the health trust stays synthetic and NOT live-verified.
          $stderr = Get-Content windows_uvicorn_stderr.log -ErrorAction SilentlyContinue | Out-String
          $stdout = Get-Content windows_uvicorn_stdout.log -ErrorAction SilentlyContinue | Out-String
          $combined = $stdout + $stderr
          if ($combined -match "Traceback") { Write-Error "startup traceback detected"; exit 1 }
          if ($combined -notmatch "ephemeral" -and $combined -notmatch "FERNET") {
            Write-Error "fail-closed ephemeral-key warning not observed in boot logs"; exit 1
          }
          $health = Get-Content windows_health.json -Raw | ConvertFrom-Json
          if ($health.data_trust -and $health.data_trust.live_verified -eq $true) {
            Write-Error "live_verified must be false without owner-supplied credentials"; exit 1
          }

      - name: Shutdown
        if: always()
        shell: pwsh
        run: |
          if (Test-Path windows_uvicorn_pid.txt) {
            $uvicornPid = Get-Content windows_uvicorn_pid.txt
            try { Stop-Process -Id $uvicornPid -Force -ErrorAction SilentlyContinue } catch { }
          }

      - name: Upload validation artifacts
        if: always()
        # WS-6 (W2-SEC C-3 completion): the last tag-pinned action is now
        # pinned by its immutable commit SHA (authoritative SHA verified via
        # git ls-remote of actions/upload-artifact on 2026-11-02: v4.6.2 =
        # ea165f8d65b6e75b540449e92b4886f43607fa02; cross-checked against the
        # release page. Lightweight tag -> the SHA is the release commit).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-validation-evidence
          path: |
            windows_run_provenance.txt
            windows_health.json
            windows_uvicorn_stdout.log
            windows_uvicorn_stderr.log
            windows_e2e_stdout.log
            windows_e2e_junit.xml
          if-no-files-found: warn
