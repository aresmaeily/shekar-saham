name: Windows installer artifact (OA-1)

# OA-1 (owner directive 2026-11-05): produce the ACTUAL unsigned Windows
# installer artifact in an authorized CI build environment.
#
# Honesty contract (directive §6):
# - the artifact is UNSIGNED (no certificate exists; CSC auto-discovery is
#   disabled so no signing is attempted and none can be claimed);
# - label: INSTALLER_ARTIFACT_READY_UNSIGNED_TARGET_INSTALL_PENDING;
# - the Electron shell STARTS and SUPERVISES the bundled backend (WAVE-N
#   remainder, 2026-11-06: bounded startup + /api/health health-check +
#   graceful shutdown + bounded crash recovery + honest degraded status page;
#   loopback-only binding).
# - WAVE-T3 (MR-I-02, 2026-11-07): the interpreter prerequisite residual is
#   CLOSED — the installer bundles a PINNED embedded CPython 3.12.10 runtime
#   (python.org embeddable amd64, MD5-verified against the official release
#   page, PSF-2.0 license notice bundled) plus a LOCAL dependency bundle
#   (pip --only-binary --target site-packages). First launch on the target
#   machine needs NO system Python, NO pip, NO venv, NO network. The bundled
#   runtime + dependency wiring is proven IN THIS WORKFLOW by running the
#   extracted python.exe against the bundled site-packages (import smoke).
#   The target-machine install itself remains owner R-1/R-2.
# - the SHA-256 is printed to the public build log AND recorded in
#   installer_provenance.txt (artifact zip download may be auth-gated; the
#   log line is the verifiable public evidence);
# - target-machine installation is NOT authorized/performed here.
#
# This workflow is ADDITIVE to windows.yml (validation) and ci.yml.

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Record provenance (source SHA / runner toolchain)
        shell: pwsh
        run: |
          "source_sha=$($env:GITHUB_SHA)" | Out-File -Append installer_provenance.txt
          "build_run_url=$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)" | Out-File -Append installer_provenance.txt
          "runner_os=$($env:RUNNER_OS)" | Out-File -Append installer_provenance.txt
          Get-Content installer_provenance.txt

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0 (SHA verified via git ls-remote on 2026-11-05)
        with:
          node-version: 20

      - name: Fetch pinned embedded Python runtime (PSF-licensed, checksum-verified) — WAVE-T3 (MR-I-02)
        shell: pwsh
        run: |
          # Pinned to the LAST 3.12.x that ships Windows binaries (3.12.16+ is
          # security-source-only; no embeddable package exists after 3.12.10).
          $pyUrl = 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
          # Official published MD5 (python.org release page python-31210).
          $pyMd5 = 'fe8ef205f2e9c3ba44d0cf9954e1abd3'
          New-Item -ItemType Directory -Force -Path electron/resources/python-runtime | Out-Null
          $zip = 'electron/resources/python-runtime/python-embed.zip'
          Invoke-WebRequest -Uri $pyUrl -OutFile $zip
          $md5 = (Get-FileHash $zip -Algorithm MD5).Hash
          if (-not ($md5 -ieq $pyMd5)) { Write-Error "embedded python MD5 mismatch: got $md5 want $pyMd5 — refusing to bundle an unverified runtime"; exit 1 }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          Expand-Archive -Path $zip -DestinationPath electron/resources/python-runtime -Force
          Remove-Item -Force $zip
          if (-not (Test-Path 'electron/resources/python-runtime/python.exe')) { Write-Error 'embedded python.exe missing after extraction'; exit 1 }
          # Wire the LOCAL dependency bundle through the runtime's own ._pth
          # (the embeddable runs in isolated mode; PYTHONPATH is ignored — the
          # ._pth file is the only correct wiring mechanism).
          $pth = 'electron/resources/python-runtime/python312._pth'
          if (-not (Test-Path $pth)) { Write-Error 'python312._pth missing — cannot wire site-packages'; exit 1 }
          Add-Content -Path $pth -Value '../site-packages'
          if (-not (Select-String -Path $pth -Pattern '../site-packages' -Quiet)) { Write-Error '._pth wiring failed'; exit 1 }
          "python_runtime_version=3.12.10" | Out-File -Append installer_provenance.txt
          "python_runtime_url=$pyUrl" | Out-File -Append installer_provenance.txt
          "python_runtime_md5_published=$pyMd5" | Out-File -Append installer_provenance.txt
          "python_runtime_md5_verified=PASS" | Out-File -Append installer_provenance.txt
          "python_runtime_sha256_recorded=$sha" | Out-File -Append installer_provenance.txt
          "python_runtime_license=PSF LICENSE VERSION 2 (bundled at python-runtime/LICENSE_PYTHON.txt)" | Out-File -Append installer_provenance.txt
          Write-Host "embedded runtime 3.12.10 fetched, MD5-verified, ._pth wired"

      - name: Bundle local dependency site-packages (offline first launch)
        shell: pwsh
        run: |
          # Resolve the EXACT pinned requirements into a LOCAL site-packages
          # tree for cp312/win_amd64 — no sdist builds (--only-binary), so the
          # bundle is reproducible byte-for-byte from the pinned wheel set.
          python -m pip install --disable-pip-version-check `
            -r backend/requirements.txt `
            --target electron/resources/site-packages `
            --only-binary=:all: --platform win_amd64 --python-version 3.12 --abi cp312 --implementation cp
          foreach ($pkg in @('fastapi','uvicorn','pydantic','numpy','orjson','httpx','tzdata')) {
            if (-not (Test-Path "electron/resources/site-packages/$pkg")) { Write-Error "dependency bundle incomplete: $pkg missing"; exit 1 }
          }
          $n = (Get-ChildItem -Recurse -File electron/resources/site-packages).Count
          "site_packages_files_bundled=$n" | Out-File -Append installer_provenance.txt
          Write-Host "dependency bundle OK — $n files"

      - name: Bundled-runtime import smoke (real interpreter against the real bundle)
        shell: pwsh
        run: |
          # The strongest verification possible in CI: run the EXTRACTED
          # python.exe against the EXTRACTED dependency bundle and import the
          # core stack. This proves the ._pth wiring end-to-end before the
          # installer is ever produced.
          $out = & electron/resources/python-runtime/python.exe -c "import fastapi, uvicorn, pydantic, numpy, orjson, httpx, tzdata; print('IMPORT-SMOKE-OK')"
          Write-Host "$out"
          if ("$out" -notmatch 'IMPORT-SMOKE-OK') { Write-Error 'bundled runtime import smoke FAILED'; exit 1 }
          "python_runtime_import_smoke=PASS (fastapi uvicorn pydantic numpy orjson httpx tzdata)" | Out-File -Append installer_provenance.txt

      - name: Bundle backend sources + frontend assets + embed release provenance (unsigned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron/resources/backend | Out-Null
          Copy-Item -Recurse -Force backend/app electron/resources/backend/app
          Copy-Item -Force backend/requirements.txt electron/resources/backend/requirements.txt
          # WAVE-S2W (2026-11-07): the backend serves the frontend from ROOT/frontend
          # where ROOT = config.py parents[3] = the packaged resources/ directory —
          # i.e. <install>/resources/frontend. Without this copy the packaged app
          # would serve /api/* but 404 on / — the recorded payload defect is closed.
          Copy-Item -Recurse -Force frontend electron/resources/frontend
          $backendVersion = "unknown"
          Select-String -Path backend/app/core/config.py -Pattern 'version:\s*str\s*=\s*"([^"]+)"' | ForEach-Object { $backendVersion = $_.Matches[0].Groups[1].Value }
          $meta = [ordered]@{
            label = 'INSTALLER_ARTIFACT_READY_UNSIGNED_TARGET_INSTALL_PENDING'
            source_sha = $env:GITHUB_SHA
            build_run_url = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
            backend_version = $backendVersion
            electron_version = '3.0.0'
            signing = 'UNSIGNED_NO_CERTIFICATE'
            smartscreen_note = 'Windows SmartScreen may warn for unsigned installers'
            python_runtime = [ordered]@{
              version = '3.12.10'
              distribution = 'python.org Windows embeddable package (64-bit), UNMODIFIED except the documented python312._pth path-wiring line (the python.org documented configuration mechanism for the embeddable distribution)'
              integrity = 'MD5 verified at build time against python.org published value; SHA-256 recorded in installer_provenance.txt'
              license = 'PSF LICENSE VERSION 2 — bundled at python-runtime/LICENSE_PYTHON.txt; full text at https://docs.python.org/3/license.html'
              dependency_bundle = 'resources/site-packages — local pip resolution of the pinned requirements (--only-binary cp312/win_amd64); first launch needs NO system Python, NO pip, NO venv, NO network'
            }
            backend_supervision = 'SUPERVISED (WAVE-N remainder, 2026-11-06): the shell starts and supervises the bundled backend as a local loopback-only child process — bounded startup (90s) + /api/health health-check + graceful shutdown + bounded crash recovery (max 3 restarts) + honest degraded status page. Interpreter prerequisite CLOSED (WAVE-T3, MR-I-02, 2026-11-07): a pinned embedded CPython 3.12.10 runtime + local dependency bundle ship INSIDE the installer; the shell prefers the bundled python.exe and falls back to the system py launcher only when it is absent. Target-machine install remains owner R-1/R-2'
          }
          $meta | ConvertTo-Json | Out-File -Encoding utf8 electron/resources/RELEASE_PROVENANCE.json
          Get-Content electron/resources/RELEASE_PROVENANCE.json

      - name: Payload verification (fail the build on an incomplete payload)
        shell: pwsh
        run: |
          # WAVE-S2W: verify the packaged layout the supervised backend resolves at
          # runtime (backend_service.js resolveBackendDir -> resources/backend) —
          # source, requirements, frontend index, and the release provenance must
          # all exist BEFORE electron-builder runs; otherwise fail the build.
          $required = @(
            'electron/resources/backend/app/main.py',
            'electron/resources/backend/requirements.txt',
            'electron/resources/frontend/index.html',
            'electron/resources/RELEASE_PROVENANCE.json',
            'electron/resources/python-runtime/python.exe',
            'electron/resources/python-runtime/python312._pth',
            'electron/resources/python-runtime/LICENSE_PYTHON.txt',
            'electron/resources/site-packages/uvicorn',
            'electron/resources/site-packages/fastapi',
            'electron/resources/site-packages/numpy'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { Write-Error ("incomplete payload: " + ($missing -join ', ')); exit 1 }
          # WAVE-AC hardening (AUDIT-D S05): ABSENCE assertions — no credential,
          # secret or environment files may ride along into the payload. The
          # bundler globs are the structural guard; this is the belt-and-suspenders
          # fail-closed check (any hit fails the build).
          # SCOPE NOTE (WAVE-AC CI-observed fix): the recursive sweep covers
          # FIRST-PARTY payload areas only (backend sources + resources top level);
          # the pip-bundled site-packages is THIRD-PARTY content installed from
          # PyPI with --only-binary — it legitimately contains CA certificate
          # bundles (certifi/cacert.pem) which are NOT credentials, so sweeping
          # it produced a false positive that failed the build (recorded, never
          # hidden: run 42386854797 job 128445955679 steps 5-8 green, step 9 exit 1).
          $forbidden = @(
            'electron/resources/backend/.env',
            'electron/resources/.env',
            'electron/resources/backend/*.key',
            'electron/resources/backend/*.pem',
            'electron/resources/backend/app/secrets*.py',
            'electron/resources/backend/pytest.ini',
            'electron/resources/backend/tox.ini'
          )
          $leaked = @($forbidden | Where-Object { Test-Path $_ })
          if ($leaked.Count -gt 0) { Write-Error ("forbidden credential/dev files in payload: " + ($leaked -join ', ')); exit 1 }
          # recursive sweep of first-party areas only (backend sources + top-level
          # resource files; site-packages excluded as third-party PyPI content)
          $swept = @(Get-ChildItem -Recurse -File electron/resources/backend -Include '*.env','*.key','*.pem','.env*' -ErrorAction SilentlyContinue)
          $sweptTop = @(Get-ChildItem -File electron/resources -Include '*.env','*.key','*.pem','.env*' -ErrorAction SilentlyContinue)
          $hits = @($swept + $sweptTop)
          if ($hits.Count -gt 0) { Write-Error ("credential-like files found in first-party payload: " + (($hits | ForEach-Object { $_.FullName }) -join ', ')); exit 1 }
          Write-Host "absence-check OK — no .env/.key/.pem/secret files in first-party payload (site-packages third-party CA bundles excluded by scope)"
          $n = (Get-ChildItem -Recurse -File electron/resources/frontend).Count
          "frontend_files_bundled=$n" | Out-File -Append installer_provenance.txt
          Write-Host "payload OK — frontend files bundled: $n"

      - name: Build NSIS installer (electron-builder, unsigned)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: SHA-256 + size recording (public log evidence)
        shell: pwsh
        run: |
          $f = Get-ChildItem "electron/dist/*.exe" | Select-Object -First 1
          if (-not $f) { Write-Error "no installer artifact produced"; exit 1 }
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "artifact_name=$($f.Name)" | Out-File -Append installer_provenance.txt
          "artifact_size_bytes=$($f.Length)" | Out-File -Append installer_provenance.txt
          "artifact_sha256=$h" | Out-File -Append installer_provenance.txt
          "unsigned=true (no signing certificate; SmartScreen may warn)" | Out-File -Append installer_provenance.txt
          Get-Content installer_provenance.txt

      - name: Upload installer artifact (retention 30 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (pinned SHA, verified 2026-11-02)
        with:
          name: windows-installer-unsigned-${{ github.sha }}
          path: |
            electron/dist/*.exe
            electron/dist/*.nsis.zip
            installer_provenance.txt
          retention-days: 30
          if-no-files-found: error
