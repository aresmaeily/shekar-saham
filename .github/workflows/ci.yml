name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # GOV-49: full history is required — the G2 acceptance-harness tests
        # (test_g2_acceptance_harness.py) run `git rev-parse HEAD~1` and
        # parent-diff checks that fail in a default depth-1 checkout.
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (pyflakes)
        working-directory: backend
        run: |
          pip install pyflakes
          python -m pyflakes app/ || exit 1

      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: Dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t radar-bourse:${{ github.sha }} .
