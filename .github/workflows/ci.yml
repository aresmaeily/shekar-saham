name: CI

# MASTER-WAVE-2 hardening (W2-SEC C-1/C-3): least-privilege workflow token and
# third-party actions pinned by immutable commit SHA (authoritative SHAs
# verified via git ls-remote of the action repositories on 2026-11-02:
# checkout v4.2.2 = 11bd7190…af683, setup-python v5.6.0 = a26af69b…d87065).
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # GOV-49: full history is required — the G2 acceptance-harness tests
        # (test_g2_acceptance_harness.py) run `git rev-parse HEAD~1` and
        # parent-diff checks that fail in a default depth-1 checkout.
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint (pyflakes)
        working-directory: backend
        run: |
          pip install pyflakes
          python -m pyflakes app/ || exit 1

      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: Dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build -t radar-bourse:${{ github.sha }} .
